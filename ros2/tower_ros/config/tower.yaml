# Parameters for both nodes. Lengths in m, angles in rad, forces in N.
# Measure before the first run: gripper_length, the block heights, and the black top offset.

tower_perception:
  ros__parameters:
    cloud_topic: /camera/camera/depth/color/points
    max_rate: 5.0
    stride: 2
    max_y: 0.79              # lab 5: keeps the wall out
    table_auto: true         # table z = most populated height in [table_min_z, table_max_z]
    table_min_z: -0.40
    table_max_z: 0.10
    ring_min: 0.06           # lab 5 TABLE_RING_MIN / MAX
    ring_max: 0.15
    band_min: 0.008          # block points: this far above the table ...
    band_max: 0.20           # ... up to this
    # HSV in OpenCV units (H 0..179), tune with lab 5's hsv_tuner
    green_h_min: 40
    green_h_max: 85
    green_s_min: 80
    green_v_min: 40
    red_h_max: 10
    red_h_min: 170
    red_s_min: 120
    red_v_min: 50
    black_v_max: 80          # lab 5 cube_max_v
    # Lab 5 saw the RealSense read the black cube top about 2 cm low. Measure the black block with a
    # ruler against /tower/black/top and put the difference here (positive raises the top).
    black_top_offset: 0.0
    green_top_offset: 0.0
    red_top_offset: 0.0
    finger_radius: 0.04
    gripper_length: 0.14

tower:
  ros__parameters:
    step: true               # Enter before every motion and gripper toggle
    dry_run: false
    stages: 2                # 1: black on green only
    velocity_scaling: 0.1    # MoveIt-planned moves
    acceleration_scaling: 0.1
    gripper_length: 0.14     # wrist_3_link to fingertips; lab 5 went 0.14 -> 0.16 -> 0.14: measure it
    finger_above_bottom: 0.015
    table_clearance: 0.02
    clearance: 0.05
    pre_grasp: 0.05
    second_estimate: true
    closeup_height: 0.30     # camera above the block top for the close-up
    camera_offset: [-0.025, 0.13, 0.0]  # must match the static TF in the launch file
    finger_axis_yaw: 0.0     # set to 0.785 if the fingers close diagonally at yaw 0
    move_speed: 0.03
    approach_speed: 0.02
    slow_zone: 0.012
    slow_speed: 0.01
    search_below: 0.004
    contact_force: 3.0
    approach_force: 6.0
    guard_force: 15.0
    retract: 0.08
    green_height: 0.05
    black_height: 0.05
    red_height: 0.04
